name: Publish to Thunderstore

on:
  release:
    types: [published] # Triggers automatically when you publish a new Release on GitHub
  workflow_dispatch:   # Allows you to manually click a "Run workflow" button for testing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C# Mod
        run: dotnet build ContentWarningArchipelago/ContentWarningArchipelago.csproj -c Release

      - name: Prepare and Pack Staging Folder
        run: |
          mkdir -p staging
          cp icon.png staging/
          cp THUNDERSTORE_README.md staging/README.md
          cp manifest.json staging/
          find . -name "ContentWarningArchipelago.dll" -exec cp {} staging/ \;
          cd staging
          zip -r ../ContentWarningArchipelago.zip .

      - name: Upload to Thunderstore
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          namespace: Faust
          name: ContentWarningArchipelago
          version: 1.0.0
          community: content-warning
          description: "An Archipelago randomizer client for Content Warning!"
          categories: |
            Mods
          deps: |
            BepInEx-BepInExPack-5.4.2100
            RugbugRedfern-MyceliumNetworking-1.0.4
          file: ./ContentWarningArchipelago.zip